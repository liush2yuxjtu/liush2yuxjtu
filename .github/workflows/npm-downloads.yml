name: Update npm download curves

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-download-curves
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fetch official npm data and render SVG
        run: python3 scripts/update_npm_downloads.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- assets/npm-downloads.svg data/npm-downloads.json; then
            echo "No download changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/npm-downloads.svg data/npm-downloads.json
          git commit -m "chore: update npm download curves"
          git push
